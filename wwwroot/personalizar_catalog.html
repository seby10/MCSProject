<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <link rel="shortcut icon" href="" type="image/x-icon" id="favicon" />
    <title>Gestión-Personalización</title>

    <!-- Custom fonts for this template -->
    <link
      href="vendor/fontawesome-free/css/all.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <!-- Custom styles for this template -->
    <link href="css/sb-admin-2.min.css" rel="stylesheet" />
    <link href="iziToast-master/dist/css/iziToast.min.css" rel="stylesheet" />

    <!-- Custom styles for this page -->
    <link
      href="vendor/datatables/dataTables.bootstrap4.min.css"
      rel="stylesheet"
    />
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />

    <link href="css/sb-admin-2.min.css" rel="stylesheet" />
    <style>
      #menuName {
        max-width: 300px;
      }

      .modal-body {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .form-check {
        margin-top: 2rem;
        margin-right: 2rem;
      }

      .checkbox-container {
        margin-bottom: 1rem;
        margin-left: 5rem;
        justify-content: center;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .input-group {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }

      .input-group input {
        flex-grow: 1;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 80%;
      }

      .input-group button {
        background-color: transparent;
        border: none;
        cursor: pointer;
        padding: 5px;
        margin-left: 5px;
      }

      @media (max-width: 768px) {
        .input-group input {
          width: 100%;
          max-width: none;
        }

        .input-group button {
          width: 100%;
          margin-top: 10px;
        }
      }
      .card-body {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .card-body .row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .card-body .col-12 {
        flex: 1 1 100%;
      }

      .card-body .col-sm-4 {
        flex: 1 1 33%;
      }

      img {
        max-width: 100%;
        max-height: 200px;
        object-fit: contain;
        display: none;
        margin-top: 10px;
      }

      input[type="file"] {
        width: 100%;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body id="page-top">
    <!-- Page Wrapper -->
    <div id="wrapper">
      <!-- Sidebar -->
      <ul
        class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion"
        id="accordionSidebar"
      >
        <!-- Sidebar - Brand -->
        <a
          class="sidebar-brand d-flex align-items-center justify-content-center"
        >
          <div class="sidebar-brand-icon rotate-n-15">
            <i class="fas fa-paint-brush"></i>
          </div>
          <div class="sidebar-brand-text mx-3">Personalizar</div>
        </a>

        <!-- Divider -->
        <hr class="sidebar-divider my-0" />

        <!-- Aquí se agregarán los menús dinámicamente -->
        <div id="dynamicMenuContainer"></div>

        <!-- Sidebar Toggler (Sidebar) -->
        <div class="text-center d-none d-md-inline">
          <button class="rounded-circle border-0" id="sidebarToggle"></button>
        </div>
      </ul>
      <!-- End of Sidebar -->

      <!-- Content Wrapper -->
      <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
          <!-- Topbar -->
          <nav
            class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow"
          >
            <!-- Topbar Navbar -->
            <ul class="navbar-nav ml-auto">
              <!-- Nav Item - User Information -->
              <li class="nav-item dropdown no-arrow">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  id="userDropdown"
                  role="button"
                  data-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  <span
                    class="mr-2 d-none d-lg-inline text-gray-600 small"
                  ></span>
                  <img
                    class="img-profile rounded-circle"
                    src="images/default.png"
                  />
                </a>
                <!-- Dropdown - User Information -->
                <div
                  class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                  aria-labelledby="userDropdown"
                >
                  <a class="dropdown-item" href="#">
                    <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                    Profile
                  </a>
                  <a class="dropdown-item" href="#">
                    <i class="fas fa-cogs fa-sm fa-fw mr-2 text-gray-400"></i>
                    Settings
                  </a>
                  <a class="dropdown-item" href="#">
                    <i class="fas fa-list fa-sm fa-fw mr-2 text-gray-400"></i>
                    Activity Log
                  </a>
                  <div class="dropdown-divider"></div>
                  <a
                    class="dropdown-item"
                    href="#"
                    data-toggle="modal"
                    data-target="#logoutModal"
                  >
                    <i
                      class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"
                    ></i>
                    Logout
                  </a>
                </div>
              </li>
              <li class="nav-item mx-1">
                <!-- Logout Button -->
                <a
                  class="btn btn-primary btn-sm ml-2"
                  href="#"
                  id="logoutButton"
                >
                  <i class="fas fa-sign-out-alt fa-sm fa-fw mr-1"></i>
                  Logout
                </a>
              </li>
            </ul>
          </nav>
          <!-- End of Topbar -->

          <!-- Begin Page Content -->
          <div class="container-fluid">
            <h1 class="h3 mb-2 text-gray-800">Títulos de Carrusel</h1>

            <div class="card shadow mb-4">
              <div class="card-body">
                <label for="Title1">Título 1</label>
                <div class="input-group">
                  <input
                    type="text"
                    value="Valor inicial 1"
                    disabled
                    id="Title1"
                  />
                  <button class="edit-button">
                    <i class="fas fa-pencil-alt"></i>
                  </button>
                </div>
                <label for="Title2">Título 2</label>
                <div class="input-group">
                  <input type="text" value="Otro valor" disabled id="Title2" />
                  <button class="edit-button">
                    <i class="fas fa-pencil-alt"></i>
                  </button>
                </div>
                <label for="Title3">Título 3</label>
                <div class="input-group">
                  <input
                    type="text"
                    value="Un tercer valor"
                    disabled
                    id="Title3"
                  />
                  <button class="edit-button">
                    <i class="fas fa-pencil-alt"></i>
                  </button>
                </div>
              </div>
            </div>

            <h1 class="h3 mb-2 text-gray-800">Colores</h1>

            <div class="card shadow mb-4">
              <div class="card-body d-flex">
                <div class="w-50 mr-2">
                  <label for="colorInput">Color Principal:</label>
                  <input
                    type="color"
                    id="colorInput"
                    name="colorInput"
                    value="#000000"
                  />

                  <div
                    id="colorPreview"
                    style="
                      width: 80%;
                      height: 50px;
                      border: 1px solid black;
                      margin-top: 10px;
                    "
                  ></div>
                </div>
              </div>
            </div>

            <h1 class="h3 mb-2 text-gray-800">Imágenes</h1>

            <div class="card shadow mb-4">
              <div class="card-body">
                <div class="row">
                  <!-- Logo -->
                  <div class="col-12 col-sm-4 mb-3">
                    <label for="logoInput">Logo:</label>
                    <br />
                    <input
                      type="file"
                      id="logoInput"
                      name="logoInput"
                      accept="image/*"
                    />
                    <br />
                    <img
                      id="imagenPrevisualizacion"
                      src="#"
                      alt="Previsualización"
                      style="max-width: 100%; max-height: 200px; display: none"
                    />
                  </div>

                  <!-- Icono -->
                  <div class="col-12 col-sm-4 mb-3">
                    <label for="iconInput">Icono:</label>
                    <br />
                    <input
                      type="file"
                      id="iconInput"
                      name="iconInput"
                      accept="image/*"
                    />
                    <br />
                    <img
                      id="imagenPrevisualizacion1"
                      src="#"
                      alt="Previsualización"
                      style="max-width: 100%; max-height: 200px; display: none"
                    />
                  </div>

                  <!-- Imagen de Fondo -->
                  <div class="col-12 col-sm-4 mb-3">
                    <label for="backgroundInput">Imagen de Fondo:</label>
                    <br />
                    <input
                      type="file"
                      id="backgroundInput"
                      name="backgroundInput"
                      accept="image/*"
                    />
                    <br />
                    <img
                      id="imagenPrevisualizacion2"
                      src="#"
                      alt="Previsualización"
                      style="max-width: 100%; max-height: 200px; display: none"
                    />
                  </div>
                </div>
              </div>
            </div>
            <div class="d-flex justify-content-end">
              <button id="saveButton" class="btn btn-success">
                Guardar cambios
              </button>
            </div>
          </div>
        </div>

        <!-- End of Main Content -->

        <!-- Footer -->
        <footer class="sticky-footer bg-white">
          <div class="container my-auto">
            <div class="copyright text-center my-auto">
              <span>Equipo 3-2024</span>
            </div>
          </div>
        </footer>
        <!-- End of Footer -->
      </div>
      <!-- End of Content Wrapper -->
    </div>

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>

    <!-- Page level plugins -->
    <script src="vendor/datatables/jquery.dataTables.min.js"></script>
    <script src="vendor/datatables/dataTables.bootstrap4.min.js"></script>

    <!-- Page level custom scripts -->
    <script src="vendor/jquery/jquery.blockUI.js"></script>
    <script src="js/personalizacion.js" type="text/javascript"></script>
    <script src="iziToast-master/dist/js/iziToast.min.js"></script>
    <script src="js/personalizar.js"></script>
  </body>
</html>
